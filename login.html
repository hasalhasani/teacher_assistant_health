<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#E9EEF4" />
    <meta name="color-scheme" content="light" />
    <title>Sign in · Teaching Assistant health</title>
    <style>
      @font-face { font-family: 'Roboto'; font-style: normal; font-weight: 100 900; font-stretch: 100%; font-display: swap; src: url('/fonts/roboto-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Material Symbols Rounded'; font-style: normal; font-weight: 400; font-display: block; src: url('/fonts/material-symbols-rounded.woff2') format('woff2'); }
    </style>
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <!-- A plain form post: the Worker (worker/index.js) checks the password and
         answers with a redirect, so this page needs no app code. -->
    <form class="login" method="post" action="/api/login">
      <h1>Teaching Assistant health</h1>
      <div class="banner" id="error" role="alert" hidden>
        <i class="material-symbols-rounded" aria-hidden="true">error</i>
        <span></span>
      </div>
      <label>
        Password
        <input class="field" type="password" name="password" autocomplete="current-password" required autofocus />
      </label>
      <button type="submit" class="filled">Sign in</button>
    </form>
    <script>
      const MESSAGES = { 1: 'That password is not correct.', 2: 'Too many attempts. Wait a minute, then try again.' };
      const message = MESSAGES[new URLSearchParams(location.search).get('error')];
      if (message) {
        const box = document.getElementById('error');
        box.querySelector('span').textContent = message;
        box.hidden = false;
      }
    </script>
  </body>
</html>
