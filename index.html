<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#E9EEF4" />
    <meta name="color-scheme" content="light" />
    <title>Teaching Assistant health</title>
    <!-- Same self-hosted faces as the Teaching Assistant frontend. The icon
         font is that app's subset: a symbol name outside it renders as text. -->
    <style>
      @font-face { font-family: 'Roboto'; font-style: normal; font-weight: 100 900; font-stretch: 100%; font-display: swap; src: url('/fonts/roboto-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Noto Sans Arabic'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/noto-sans-arabic.woff2') format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: 'Material Symbols Rounded'; font-style: normal; font-weight: 400; font-display: block; src: url('/fonts/material-symbols-rounded.woff2') format('woff2'); }
    </style>
    <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
